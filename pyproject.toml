[project]
name = "newsdesk"
version = "1.0.0"
description = "A configurable daily news board driven by Fabric patterns"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Clancey" },
]
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.scripts]
newsdesk = "newsdesk.cli:main"

[project.urls]
Repository = "https://github.com/cmcneal/newsdesk"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newsdesk"]
include-package-data = true
